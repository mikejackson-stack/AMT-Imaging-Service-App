name: Deploy App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download app files only (no git checkout — skips multi-GB Manuals)
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          curl -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/index.html" \
            -o _site/index.html
          curl -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/rates.json" \
            -o _site/rates.json
          curl -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/sw.js" \
            -o _site/sw.js
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          token = os.environ.get("GH_TOKEN", "")
          dest_root = "_site"

          def get_json(url):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "amt-pages-deploy",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if token:
                  headers["Authorization"] = "Bearer " + token
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as err:
                  body = err.read().decode("utf-8", "replace")[:500]
                  raise SystemExit(f"GitHub API {err.code} for {url}: {body}") from err

          def list_kb_json(path):
              quoted = urllib.parse.quote(path, safe="/")
              ref = urllib.parse.quote(sha, safe="")
              url = f"https://api.github.com/repos/{repo}/contents/{quoted}?ref={ref}"
              items = get_json(url)
              if isinstance(items, dict):
                  items = [items]
              if len(items) >= 1000:
                  raise SystemExit(f"{path} listing hit the contents API cap; refusing a partial publish")
              found = []
              for item in items:
                  kind = item.get("type")
                  name = item.get("name") or ""
                  item_path = item.get("path") or ""
                  if kind == "dir":
                      found.extend(list_kb_json(item_path))
                  elif kind == "file" and name.endswith(".json"):
                      if not item_path.startswith("kb/"):
                          raise SystemExit(f"refusing to publish outside kb/: {item_path}")
                      found.append(item_path)
              return found

          paths = list_kb_json("kb")
          if not paths:
              raise SystemExit("kb/ has no .json files to publish")
          for rel in paths:
              quoted = urllib.parse.quote(rel, safe="/")
              raw = f"https://raw.githubusercontent.com/{repo}/{sha}/{quoted}"
              req = urllib.request.Request(raw, headers={"User-Agent": "amt-pages-deploy"})
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = resp.read()
              except urllib.error.HTTPError as err:
                  raise SystemExit(f"download failed {err.code} {rel}") from err
              if not data:
                  raise SystemExit(f"empty download: {rel}")
              dest = os.path.join(dest_root, rel)
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              with open(dest, "wb") as fh:
                  fh.write(data)
              print(f"published {rel} ({len(data)} bytes)")
          marker = os.path.join(dest_root, "kb", "ge-loose-kb.json")
          with open(marker, "rb") as fh:
              head = fh.read(1)
          if head != b"[":
              raise SystemExit("kb/ge-loose-kb.json is not a JSON array")
          PY
          touch _site/.nojekyll
          test ! -e _site/Manuals

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
