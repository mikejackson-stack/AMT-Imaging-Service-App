;  Settings for cdviewer.exe, a viewer for dtSearch Publish CDs
[OPTIONS]
;   Home page 
HomePage=/index.html

;   Search page
SearchPage=/dtSearch.html

;   Help page 
HelpPage = /dtSearch_help.html

; Open web links in default browser
WebLinksInBrowser=1

; Extensions of file types to launch outside of the lbview.exe viewer program
; You can use this to ensure that links to .doc, .xls, etc. files open in Microsoft Office
; when a user clicks them inside the viewer
ExternalLaunchExtensions=msg;xls;doc;ppt;wpd;docx;pptx;xlsx;rtf

; Extensions of file types to copy when clicked (the user will be prompt for the location to copy to)
CopyFileExtensions=zip

; Minimum version of Adobe Reader needed for the content in this collection
;
; Set to 0 (zero) if the collection will not include PDF files
MinimumAdobeReaderVersion=6

; Page to display if Adobe Reader is not installed, or if an older version is installed
;
; This page is displayed if the Adobe Reader version indicated by MinimumAdobeReaderVersion
; (above) is not present.
GetAdobeReaderPage=/builtin/getadobe.html

; Minimum version of Internet Explorer needed for the content in this collection
MinimumIEVersion=5

; Page to display if Internet Explorer is not installed, or if an older version is installed
GetNewIEPage=/builtin/getnewie.html

; Error page to display, for example, if a broken link is found
ErrorPage=/builtin/error.html

; Set to 1 if a proxy server is preventing access
ProxyBypass=0

; Message to display if Adobe Reader has hit highlighting disabled
EnablePdfHighlightMessage=Would you like to enable hit highlighting for PDF files (currently disabled in Adobe Reader or Adobe Acrobat)?

; Set to 1 to silently enable PDF hit highlighting if Adobe Reader has hit highlighting disabled
SilentEnablePdfHighlighting=0

