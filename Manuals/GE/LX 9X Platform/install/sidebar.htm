<script language="JavaScript">

function get_file(filename){
	
	
		url         = filename
		windowName  = "parts";

		params      = "toolbar=0,";
		params     += "location=0,";
		params     += "directories=0,";
		params     += "status=0,";
		params     += "menubar=1,";
		params     += "scrollbars=1,";
		params     += "resizable=1,";
		params     += "width= 620";
		params     += "height= 460";

		win = window.open(url, windowName, params);
		if (!win.opener) {
			win.opener = window;
		}
	
} 
</script>
