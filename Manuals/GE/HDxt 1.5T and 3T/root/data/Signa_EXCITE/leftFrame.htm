		function topofthePage()
		{
			var str_url_value=window.top.mainFrame.document.location;
			var str_test=String(str_url_value);
			var url_top_index=str_test.indexOf('#');
			if(!url_top_index<=-1)
			{
				var url_of_page=str_url_value.substring(url_top_index);
				val_of_url=url_of_page;
				document.location.target="mainFrame";
				window.top.mainFrame.document.location.href=url_of_page;
			}
			else
			{
				document.location.target="mainFrame";
				window.top.mainFrame.document.location.href=window.top.mainFrame.document.location;
			}
		}
		
		function expand_collapse_all()
		{
