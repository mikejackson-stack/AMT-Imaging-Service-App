   <TITLE>OC Info Commands</TITLE><LINK REL="StyleSheet" HREF="../css/style.css" type="text/css"><script language="JavaScript" src="../scripts/winopen.js"></script><script language="JavaScript" src="../scripts/webmonk.gos"></script><script language="JavaScript" src="../scripts/modules_init.js"></script><script language="JavaScript" src="../scripts/bookmark.js"></script><script language="JavaScript" src="../scripts/efunctions.js"></script></HEAD><BODY><DIV CLASS="TABLE"><CENTER><P CLASS="TABLEINTRO" ID=""><SPAN CLASS="TABLEINTRO"><B>Table 2:&nbsp;&nbsp;</B></SPAN><SPAN CLASS="TABLETITLE">OC Info Commands</SPAN> </P><table summary="OC Info Commands" border="1"><colgroup><col width="216"><col width="336"></colgroup><thead><tr><th align="left" valign="top">CONFIG FILES LIST ITEM</th><th align="left" valign="top">ACTION (EQUIVALENT IRIX COMMAND)</th></tr></thead><tbody><tr><td align="left" valign="top">OC host.cfg</td><td align="left" valign="top"><SPAN CLASS="INPUTFIX"><FONT FACE="COURIER"><B>cat /usr/g/config/host.cfg</B></FONT></SPAN></td></tr><tr><td align="left" valign="top">OC scanhardware.cfg</td><td align="left" valign="top"><SPAN CLASS="INPUTFIX"><FONT FACE="COURIER"><B>cat /usr/g/config/scanhardware.cfg</B></FONT></SPAN></td></tr><tr><td align="left" valign="top">INFO file</td><td align="left" valign="top"><SPAN CLASS="INPUTFIX"><FONT FACE="COURIER"><B>cat /usr/g/config/INFO</B></FONT></SPAN></td></tr></tbody></table></CENTER></DIV></BODY></HTML>
