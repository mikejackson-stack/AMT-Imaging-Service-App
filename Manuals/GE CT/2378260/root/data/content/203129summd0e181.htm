you will be prompted through the individual entries. Where:</p><p><SPAN CLASS="INPUTVAR"><FONT FACE="COURIER"><B><I>mm</I></B></FONT></SPAN>  is month (01-12) </p><p><SPAN CLASS="INPUTVAR"><FONT FACE="COURIER"><B><I>dd</I></B></FONT></SPAN>  is day (01-31) </p><p><SPAN CLASS="INPUTVAR"><FONT FACE="COURIER"><B><I>hh</I></B></FONT></SPAN>  is hour (00-23) </p><p><SPAN CLASS="INPUTVAR"><FONT FACE="COURIER"><B><I>mm</I></B></FONT></SPAN>  is minutes (00-59) </p><p><SPAN CLASS="INPUTVAR"><FONT FACE="COURIER"><B><I>yyyy</I></B></FONT></SPAN>  is year (1980-2030)</p></TD></TR></TBODY></TABLE><P CLASS="TABLESPACER"></P><P>&nbsp;</P></BODY></HTML>
