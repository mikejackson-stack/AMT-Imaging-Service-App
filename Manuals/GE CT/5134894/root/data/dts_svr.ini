[OPTIONS]
;   Specify a port to use (default is to select a port automatically)
Port=7860

;  Specify URL to open
;  This should always be localhost or something equivalent
;  Using the IP address avoids potential DNS-related problems
HostName=127.0.0.1
;HostName=localhost

; Automatically shut down the HTTP server after this many seconds of inactivity
AutoStopOnIdle=900

; Automatically shut down when browser closes
AutoStopOnBrowser=1

; Allow directory listings to be displayed if a folder does not have index.html, default.html, etc.
AllowListing=0

; Include modification date in listing
ListingIncludeDate=1

; Include file size in listing
ListingIncludeSize=1

; Include name of folder in listing
ListingIncludeFolder=1

; Include link to parent folder in listing
ListingIncludeParentLink=1

; HTML to include at top of listing
; ListingHeader=<h3>Folder contents</h3>

; Specify browser to open
; 
; The name is mapped to an executable using the table in this registry key:
;   HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\App Paths\
; 
; ie and iexplore are equivalent
;
; If no browser is specified, the default browser will be used.  For some users,
; this may prevent the CD from working as expected.
Browser=ie
;Browser=iexplore
;Browser=opera


[alias]
cgi-bin=../cgi-bin




