   <TITLE></TITLE><LINK REL="StyleSheet" HREF="../css/style.css" type="text/css"><script language="JavaScript" src="../scripts/winopen.js"></script><script language="JavaScript" src="../scripts/webmonk.gos"></script><script language="JavaScript" src="../scripts/modules_init.js"></script><script language="JavaScript" src="../scripts/bookmark.js"></script><script language="JavaScript" src="../scripts/efunctions.js"></script></HEAD><BODY><P CLASS="stepdetails"><SPAN CLASS="INPUTFIX"><FONT FACE="COURIER"><B>mountMOD -I2L</B></FONT></SPAN><SPAN CLASS="KEYBOARD">&lt;Enter&gt;</SPAN></P><P CLASS="stepdetails"><SPAN CLASS="INPUTFIX"><FONT FACE="COURIER"><B>mv /usr/g/service/.bb /usr/g/service/bb.lfc</B></FONT></SPAN><SPAN CLASS="KEYBOARD">&lt;Enter&gt;</SPAN></P><P CLASS="stepdetails"><SPAN CLASS="INPUTFIX"><FONT FACE="COURIER"><B>mkdir /usr/g/service/.bb</B></FONT></SPAN><SPAN CLASS="KEYBOARD">&lt;Enter&gt;</SPAN></P><P CLASS="stepdetails"><SPAN CLASS="INPUTFIX"><FONT FACE="COURIER"><B>rm -rf /tmp/*bb</B></FONT></SPAN><SPAN CLASS="KEYBOARD">&lt;Enter&gt;</SPAN></P><P CLASS="stepdetails"><SPAN CLASS="INPUTFIX"><FONT FACE="COURIER"><B>cp /MOD/service_mod_data/system_state/*bb /usr/g/service/.bb</B></FONT></SPAN><SPAN CLASS="KEYBOARD">&lt;Enter&gt;</SPAN></P><P CLASS="stepdetails"><SPAN CLASS="INPUTFIX"><FONT FACE="COURIER"><B>/usr/g/bin/SwapTubeData</B></FONT></SPAN><SPAN CLASS="KEYBOARD">&lt;Enter&gt;</SPAN></P><P CLASS="stepdetails"><SPAN CLASS="INPUTFIX"><FONT FACE="COURIER"><B>cp -f /tmp/*bb /usr/g/service/.bb</B></FONT></SPAN><SPAN CLASS="KEYBOARD">&lt;Enter&gt;</SPAN></P><P>&nbsp;</P></BODY></HTML>
