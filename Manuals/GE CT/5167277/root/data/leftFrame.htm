		function initialCmodule()
		{
			document.body.style.overflow='Scroll';
			parent.document.getElementById('frame').cols="180,*";
			window.parent.topleftFrame.location.reload();
			window.parent.topleftFrame.document.getElementById('img_expand_collapse').src="images/btn_arrow_down.gif";

			val_shift_expand_Frame=0;
			val_expand_right_Frame=0;
			val_expand_collapse=0;
		}
		
		function topofthePage()
		{
			var str_url_value=window.top.mainFrame.document.location;
			var str_test=String(str_url_value);
			var url_top_index=str_test.indexOf('#');
			if(!url_top_index<=-1)
			{
				var url_of_page=str_url_value.substring(url_top_index);
				val_of_url=url_of_page;
				document.location.target="mainFrame";
				window.top.mainFrame.document.location.href=url_of_page;
			}
			else
			{
				document.location.target="mainFrame";
				window.top.mainFrame.document.location.href=window.top.mainFrame.document.location;
			}
		}
		
		function expand_collapse_all()
		{
			
			if(val_expand_collapse==0)
			{
				d.openAll();
				window.parent.topleftFrame.document.getElementById('img_expand_collapse').src="images/btn_arrow_up.gif";
				window.parent.topleftFrame.document.getElementById('img_expand_collapse').title="Collapse All";
				val_expand_collapse=1;
			}
			else
			{
				d.closeAll();
				window.parent.topleftFrame.document.getElementById('img_expand_collapse').src="images/btn_arrow_down.gif";
				window.parent.topleftFrame.document.getElementById('img_expand_collapse').title="Expand All";
				val_expand_collapse=0;
			}
		}
